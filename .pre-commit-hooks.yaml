# pre-commit hook definitions (https://pre-commit.com).
#
# Usage in a project's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/matteo-sung/lockvet
#       rev: v0.5.4
#       hooks:
#         - id: lockvet
#
# The hook runs `lockvet` on the staged change (working tree vs HEAD) and
# fails the commit only on the alarming tier: known vulnerabilities,
# versions missing from their registry index, newly added install scripts,
# dropped build provenance, typosquat lookalikes, and integrity/resolution
# tampering. Override `args` to tune (e.g. add major,fresh — or use
# -offline for a network-free commit gate that still catches downgrades,
# repins and typosquats).
- id: lockvet
  name: lockvet (vet lockfile changes)
  description: >-
    Explain and gate dependency lockfile changes: vulnerabilities fixed and
    introduced (OSV.dev), release ages, deprecations, versions missing from
    the registry index, newly added install scripts, dropped provenance,
    typosquat lookalikes, integrity/resolution tampering, and the dependency
    chain pulling each transitive change in. 44 lockfile formats plus SBOMs,
    CI workflow pins, container base images (Dockerfile / Compose),
    Kubernetes manifests and kustomizations (Flux and Argo CD CRs
    included), and pre-commit hook rev pins themselves.
  entry: lockvet
  args: ["-fail-on", "vuln,unlisted,scripts,provenance,typosquat,integrity,registry"]
  language: golang
  pass_filenames: false
  require_serial: true
  verbose: true
  minimum_pre_commit_version: "3.0.0"
  files: >-
    (?x)^(.*/)?(
      package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|
      bun\.lock|Cargo\.lock|uv\.lock|poetry\.lock|requirements\.txt|
      pylock\.toml|pylock\.[^/]+\.toml|
      go\.mod|go\.sum|composer\.lock|Gemfile\.lock|[^/]*\.gemfile\.lock|Pipfile\.lock|mix\.lock|rebar\.lock|
      pubspec\.lock|gradle\.lockfile|packages\.lock\.json|Package\.resolved|
      Podfile\.lock|deno\.lock|flake\.lock|renv\.lock|
      [^/]*conda-lock\.ya?ml|[^/]*pixi\.lock|[^/]*\.terraform\.lock\.hcl|
      Chart\.lock|Chart\.ya?ml|requirements\.ya?ml|requirements\.lock|[Mm]anifest\.toml|Manifest-v[^/]*\.toml|
      stack\.yaml\.lock|cabal\.project\.freeze|cabal\.config|conan\.lock|
      MODULE\.bazel|MODULE\.bazel\.lock|build\.zig\.zon|
      Dockerfile|Containerfile|Dockerfile\.[^/]+|[^/]+\.[Dd]ockerfile|
      Containerfile\.[^/]+|[^/]+\.Containerfile|
      (docker-)?compose(\.[^/]+)?\.ya?ml|
      [^/]*\.versions\.toml|verification-metadata(\.dryrun)?\.xml|
      bom\.json|sbom\.json|cyclonedx\.json|spdx\.json|
      [^/]*\.(cdx|spdx|cyclonedx)\.json|
      action\.ya?ml|\.pre-commit-config\.ya?ml|
      kustomization\.ya?ml|[^/]*\.k8s\.ya?ml|
      (deployment|statefulset|daemonset|replicaset|cronjob|pod)\.ya?ml|
      (helmrelease|helm-release|release|ocirepository|helmrepository)\.ya?ml|
      (application|applicationset|appset)\.ya?ml
    )$
    |^(.*/)?\.(github|gitea|forgejo)/workflows/[^/]+\.ya?ml$
    |^(.*/)?(k8s|kubernetes|manifests|deploy|overlays|base|clusters|gitops|apps|infrastructure|infra|flux|flux-system|charts?|argocd|argo|argo-cd|applications|applicationsets)/.*\.ya?ml$
