name: lockvet
description: >-
  Explain lockfile changes on pull requests: version bumps classified
  major/minor/patch, vulnerabilities introduced and fixed (via OSV.dev),
  release ages and deprecations (via deps.dev). Posts a summary comment
  on the PR.
author: Matteo Sung
branding:
  icon: lock
  color: orange

inputs:
  fail-on:
    description: 'Fail the check on: "major", "vuln", "downgrade", "fresh", "deprecated", "unlisted", "scripts", "provenance", "license" (comma list). Empty = never fail.'
    required: false
    default: ''
  fresh-days:
    description: Flag versions published fewer than N days ago (0 shows ages but never flags).
    required: false
    default: '7'
  changelogs:
    description: >-
      Fetch upstream release notes for every bump — including the releases a
      multi-version jump skips over — and include them in the report
      (true/false).
    required: false
    default: 'false'
  comment:
    description: Post/update a PR comment with the report (true/false).
    required: false
    default: 'true'
  sarif:
    description: >-
      Upload findings to GitHub Code Scanning so vulnerable, unresolved and
      deprecated incoming versions become alerts on the exact lockfile line
      (true/false). The job needs `permissions: security-events: write`.
    required: false
    default: 'false'
  github-token:
    description: Token used to post the PR comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    - name: Install lockvet
      shell: bash
      working-directory: ${{ github.action_path }}
      # Build from the action's own checkout: exactly the version the user
      # pinned, no module-proxy round trip.
      run: |
        mkdir -p "$RUNNER_TEMP/lockvet-bin"
        go build -o "$RUNNER_TEMP/lockvet-bin/lockvet" .
        echo "$RUNNER_TEMP/lockvet-bin" >> "$GITHUB_PATH"

    - name: Run lockvet
      id: run
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -o pipefail
        rc=0
        lockvet -md -fresh-days "${{ inputs.fresh-days }}" \
          ${{ inputs.changelogs == 'true' && '-changelogs' || '' }} \
          ${{ inputs.fail-on != '' && format('-fail-on {0}', inputs.fail-on) || '' }} \
          "$BASE" HEAD > lockvet-report.md 2> lockvet-stderr.log || rc=$?
        cat lockvet-stderr.log >&2 || true
        # rc=1 → fail-on condition hit (report still valid); rc=2 → hard error
        if [ "$rc" = "2" ]; then exit 2; fi
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        if [ -s lockvet-report.md ]; then
          echo "has_report=true" >> "$GITHUB_OUTPUT"
          cat lockvet-report.md >> "$GITHUB_STEP_SUMMARY"
        else
          echo "has_report=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on PR
      if: inputs.comment == 'true' && steps.run.outputs.has_report == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        printf '<!-- lockvet-report -->\n\n' > body.md
        cat lockvet-report.md >> body.md
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- lockvet-report -->")) | .id' | head -1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
        fi

    - name: Upload SARIF to code scanning
      if: inputs.sarif == 'true' && steps.run.outputs.has_report == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ github.event.pull_request.base.sha }}
        REPO: ${{ github.repository }}
      run: |
        lockvet -sarif -fresh-days "${{ inputs.fresh-days }}" "$BASE" HEAD > lockvet.sarif
        gh api "repos/$REPO/code-scanning/sarifs" \
          -f commit_sha="$GITHUB_SHA" \
          -f ref="$GITHUB_REF" \
          -f sarif="$(gzip -c lockvet.sarif | base64 -w0)" > /dev/null
        echo "lockvet: SARIF uploaded for $GITHUB_REF @ $GITHUB_SHA"

    - name: Enforce fail-on
      if: steps.run.outputs.rc == '1'
      shell: bash
      run: |
        echo "::error::lockvet: fail-on condition met (${{ inputs.fail-on }})"
        exit 1
