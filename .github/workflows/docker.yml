name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build (e.g. v0.1.11)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # On tag push, build the tag. On manual dispatch (backfill for tags
      # that predate this workflow), build the dispatched ref and label it
      # with the requested version — only do this when the source is
      # identical to the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && steps.meta.outputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          # MCP Registry ownership verification reads this annotation
          # (the Dockerfile LABEL covers per-arch configs; these cover the
          # index + manifests of the multi-arch image).
          annotations: |
            index:io.modelcontextprotocol.server.name=io.github.matteo-sung/lockvet
            manifest:io.modelcontextprotocol.server.name=io.github.matteo-sung/lockvet
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      # Sigstore build provenance for the multi-arch image (verify with:
      #   gh attestation verify oci://ghcr.io/matteo-sung/lockvet:<tag> --owner matteo-sung)
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMG: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Version matches tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker run --rm "$IMG" lockvet -version | tee out.txt
          grep -qF "$TAG" out.txt
      - name: PR mode over the network
        run: |
          docker run --rm -e GITHUB_TOKEN "$IMG" \
            lockvet pr https://github.com/matteo-sung/lockvet-demo/pull/1 | tee pr.txt
          grep -q "transitive" pr.txt
      - name: Local git mode on a mounted repo
        run: |
          git clone -b bump-deps https://github.com/matteo-sung/lockvet-demo /tmp/demo
          git -C /tmp/demo fetch origin main
          docker run --rm -e GITHUB_TOKEN -v /tmp/demo:/repo -w /repo "$IMG" \
            lockvet origin/main | tee local.txt
          grep -q "lodash" local.txt
