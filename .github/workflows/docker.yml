name: docker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build (e.g. v0.1.11)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  verify:
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMG: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Version matches tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker run --rm "$IMG" lockvet -version | tee out.txt
          grep -qF "$TAG" out.txt
      - name: PR mode over the network
        run: |
          docker run --rm -e GITHUB_TOKEN "$IMG" \
            lockvet pr https://github.com/matteo-sung/lockvet-demo/pull/1 | tee pr.txt
          grep -q "transitive" pr.txt
      - name: Local git mode on a mounted repo
        run: |
          git clone -b bump-deps https://github.com/matteo-sung/lockvet-demo /tmp/demo
          git -C /tmp/demo fetch origin main
          docker run --rm -e GITHUB_TOKEN -v /tmp/demo:/repo -w /repo "$IMG" \
            lockvet origin/main | tee local.txt
          grep -q "lodash" local.txt
