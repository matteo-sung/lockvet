# Builds the browser playground (Go → WebAssembly) and deploys it to
# GitHub Pages: https://matteo-sung.github.io/lockvet/
name: pages

on:
  push:
    branches: [main]
    paths:
      - "playground/**"
      - "internal/**"
      - "go.mod"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Build wasm
        run: |
          set -euo pipefail
          mkdir -p site
          VERSION=$(git describe --tags --always)
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o site/lockvet.wasm ./playground
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/
          cp playground/web/index.html site/
          ls -lh site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
