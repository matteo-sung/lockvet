name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Build all platforms
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist extras/completions extras/man
          go run -ldflags "-X main.version=${VERSION}" . completion bash > extras/completions/lockvet.bash
          go run -ldflags "-X main.version=${VERSION}" . completion zsh  > extras/completions/_lockvet
          go run -ldflags "-X main.version=${VERSION}" . completion fish > extras/completions/lockvet.fish
          go run -ldflags "-X main.version=${VERSION}" . man > extras/man/lockvet.1
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/lockvet_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${out}/lockvet${ext}" .
            cp LICENSE README.md "${out}/"
            if [ "$GOOS" != "windows" ]; then
              cp -r extras/completions extras/man "${out}/"
            fi
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out##*/}.zip" "${out##*/}")
            else
              tar -C dist -czf "${out}.tar.gz" "${out##*/}"
            fi
            rm -r "${out}"
          done
          (cd dist && sha256sum * > checksums.txt)
      # Sigstore build provenance for every artifact (verify with:
      #   gh attestation verify <file> --owner matteo-sung)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "lockvet $GITHUB_REF_NAME" --generate-notes
