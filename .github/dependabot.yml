version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql-action init/analyze/upload-sarif must move in lockstep:
      # a config written by init vX refuses to load under analyze vY.
      codeql-action:
        patterns:
          - github/codeql-action*
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
